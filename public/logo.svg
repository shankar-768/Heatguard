<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield Background -->
  <path d="M50 8 L85 24 C85 58 50 88 50 88 C50 88 15 58 15 24 Z" fill="url(#shieldGrad)" stroke="#FBBF24" stroke-width="2.5" />
  <path d="M50 14 L78 28 C78 54 50 78 50 78 C50 78 22 54 22 28 Z" fill="#0F172A" opacity="0.65" />
  
  <!-- Heat Sun Core -->
  <circle cx="50" cy="45" r="14" fill="url(#sunGrad)" filter="url(#glow)"/>
  
  <!-- Heatwave lines -->
  <path d="M36 45 Q 43 38, 50 45 T 64 45" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M34 53 Q 42 46, 50 53 T 66 53" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M38 61 Q 44 56, 50 61 T 62 61" stroke="#F97316" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  
  <!-- Radar/Sensor Arc -->
  <path d="M30 30 A 24 24 0 0 1 70 30" stroke="#FDE047" stroke-width="2" stroke-dasharray="2 3" fill="none" opacity="0.85"/>
</svg>
